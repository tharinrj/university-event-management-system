name: Deploy University Event Management

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/university-event-management-system

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Spring Boot..."
            cd backend
            mvn clean package -DskipTests

            echo "Restarting Spring Boot..."
            sudo systemctl restart event-manager

            echo "Building React..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deploying React..."
            sudo rm -rf /var/www/university-event-management/*
            sudo cp -r dist/* /var/www/university-event-management/

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed!"