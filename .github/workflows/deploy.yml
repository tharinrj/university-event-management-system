name: Deploy University Event Management

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pass secrets as environment variables so the script can use them
          # without them ever appearing in the workflow YAML in plain text.
          envs: JWT_SECRET,DB_USERNAME,DB_PASSWORD
          script: |
            set -e

            cd /home/ubuntu/university-event-management-system

            echo "Pulling latest code..."
            git pull origin main

            # ── Write secrets to a protected environment file ────────────────
            # This file is read by the systemd service via EnvironmentFile=
            # and is never committed to the repository.
            sudo mkdir -p /etc/event-manager
            sudo tee /etc/event-manager/env > /dev/null <<EOF
            JWT_SECRET=${JWT_SECRET}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            EOF
            # Restrict access: readable only by root and the service user
            sudo chmod 600 /etc/event-manager/env
            sudo chown root:root /etc/event-manager/env

            # ── Ensure the systemd unit loads the env file ───────────────────
            # Patch the unit in-place only if EnvironmentFile is not yet set.
            UNIT_FILE=$(sudo systemctl show -P FragmentPath event-manager)
            if ! sudo grep -q "EnvironmentFile" "$UNIT_FILE"; then
              sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/event-manager/env' "$UNIT_FILE"
              sudo systemctl daemon-reload
            fi

            echo "Building Spring Boot..."
            cd backend
            mvn clean package -DskipTests

            echo "Restarting Spring Boot..."
            sudo systemctl restart event-manager

            echo "Building React..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deploying React..."
            sudo rm -rf /var/www/university-event-management/*
            sudo cp -r dist/* /var/www/university-event-management/

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed!"