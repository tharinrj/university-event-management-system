app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://event-manager.trj.app
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-replace-in-production-must-be-256-bits}
    expiration-ms: 86400000  # 24 hours

spring:
  application:
    name: event-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/event_manager?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    repair-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false